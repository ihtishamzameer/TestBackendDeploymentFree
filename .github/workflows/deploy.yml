name: Build, Test and Deploy to MonsterASP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Test01/Test01.csproj

      - name: Build
        run: dotnet build Test01/Test01.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Test01/Test01.csproj --configuration Release --no-build

      - name: Publish
        run: dotnet publish Test01/Test01.csproj --configuration Release --output ./publish --runtime win-x86

      - name: Locate MSDeploy
        shell: powershell
        run: |
          $paths = @(
            "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe",
            "${env:ProgramFiles}\IIS\Microsoft Web Deploy V4\msdeploy.exe",
            "${env:ProgramFiles}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          )

          $msdeploy = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $msdeploy) {
            Write-Error "MSDeploy.exe was not found."
            exit 1
          }

          Write-Host "MSDeploy found at: $msdeploy"

      - name: Deploy to MonsterASP
        shell: cmd
        env:
          WEBSITE_NAME: ${{ secrets.WEBSITE_NAME }}
          SERVER_COMPUTER_NAME: ${{ secrets.SERVER_COMPUTER_NAME }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}

        run: |
          set "MSDEPLOY=C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          set "SOURCE=%GITHUB_WORKSPACE%\publish"
          set "DESTINATION=%SERVER_COMPUTER_NAME%/msdeploy.axd?site=%WEBSITE_NAME%"

          echo Deploying to MonsterASP...
          echo Website: %WEBSITE_NAME%
          echo Server: %SERVER_COMPUTER_NAME%

          "%MSDEPLOY%" ^
            -verb:sync ^
            "-source:contentPath=%SOURCE%" ^
            "-dest:contentPath=%WEBSITE_NAME%,computerName=%DESTINATION%,userName=%SERVER_USERNAME%,password=%SERVER_PASSWORD%,authType=Basic,includeAcls=False" ^
            -allowUntrusted ^
            -disableLink:AppPoolExtension ^
            -disableLink:ContentExtension ^
            -disableLink:CertificateExtension ^
            -verbose

          if errorlevel 1 (
            echo MSDeploy failed.
            exit /b 1
          )

          echo Deployment completed successfully.