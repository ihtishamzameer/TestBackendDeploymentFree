name: Build, Test and Deploy to MonsterASP

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Test01/Test01.csproj

      - name: Build
        run: dotnet build Test01/Test01.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Test01/Test01.csproj --configuration Release --no-build

      - name: Publish
        run: dotnet publish Test01/Test01.csproj --configuration Release --output ./publish --runtime win-x86

      - name: Deploy to MonsterASP
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}