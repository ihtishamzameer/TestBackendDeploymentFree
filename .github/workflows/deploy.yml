name: Build, Test and Deploy to MonsterASP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Test01/Test01.csproj

      - name: Build
        run: dotnet build Test01/Test01.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Test01/Test01.csproj --configuration Release --no-build

      - name: Publish
        run: dotnet publish Test01/Test01.csproj --configuration Release --output ./publish --runtime win-x86

      - name: Locate MSDeploy
        shell: powershell
        run: |
          $paths = @(
            "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe",
            "${env:ProgramFiles}\IIS\Microsoft Web Deploy V4\msdeploy.exe",
            "${env:ProgramFiles}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          )

          $msdeploy = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $msdeploy) {
            Write-Error "MSDeploy.exe was not found on the GitHub Windows runner."
            exit 1
          }

          Write-Host "MSDeploy found at: $msdeploy"

      - name: Deploy to MonsterASP
        shell: powershell
        env:
          WEBSITE_NAME: ${{ secrets.WEBSITE_NAME }}
          SERVER_COMPUTER_NAME: ${{ secrets.SERVER_COMPUTER_NAME }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          $paths = @(
            "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe",
            "${env:ProgramFiles}\IIS\Microsoft Web Deploy V4\msdeploy.exe",
            "${env:ProgramFiles}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          )

          $msdeploy = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $msdeploy) {
            Write-Error "MSDeploy.exe was not found."
            exit 1
          }

          $destinationUrl = "$env:SERVER_COMPUTER_NAME/msdeploy.axd?site=$env:WEBSITE_NAME"
          $sourcePath = "$env:GITHUB_WORKSPACE\publish"

          Write-Host "Deploying to MonsterASP..."
          Write-Host "Website: $env:WEBSITE_NAME"
          Write-Host "Server: $env:SERVER_COMPUTER_NAME"

          $msdeployArgs = @(
            "-verb:sync"
            "-source:contentPath=$sourcePath"
            "-dest:contentPath=$env:WEBSITE_NAME,computerName=$destinationUrl,userName=$env:SERVER_USERNAME,password=$env:SERVER_PASSWORD,authType=Basic,includeAcls=False"
            "-allowUntrusted"
            "-disableLink:AppPoolExtension"
            "-disableLink:ContentExtension"
            "-disableLink:CertificateExtension"
            "-verbose"
          )

          & $msdeploy @msdeployArgs

          if ($LASTEXITCODE -ne 0) {
            Write-Error "MSDeploy failed with exit code $LASTEXITCODE."
            exit $LASTEXITCODE
          }

          Write-Host "Deployment completed successfully."